# 競技サーバ上 (systemd otelcol-contrib) で動く agent。{{PERF_IP}} は make perf-agent が置換
receivers:
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: { enabled: true }
      load:
      memory:
      disk:
      network:
  # アプリから OTel trace を送るならここで受ける (localhost:4318)
  otlp:
    protocols:
      http: { endpoint: 127.0.0.1:4318 }
      grpc: { endpoint: 127.0.0.1:4317 }

processors:
  resourcedetection:
    detectors: [system]
    timeout: 2s
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s

exporters:
  otlphttp:
    endpoint: http://{{PERF_IP}}:4318
    tls: { insecure: true }
    retry_on_failure: { enabled: true, max_elapsed_time: 120s }
    sending_queue: { enabled: true, queue_size: 500 }

service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
