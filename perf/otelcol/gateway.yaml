# perf 上 (compose) で動く gateway: 競技サーバの agent から OTLP を受けて ClickHouse へ
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4&async_insert=1
    username: isucon
    password: ${env:CLICKHOUSE_PASSWORD}
    database: otel
    ttl: 72h
    timeout: 10s
    sending_queue: { queue_size: 100 }
    retry_on_failure: { enabled: true }

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
